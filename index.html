<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Try-On</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    /* ── 左右面板通用 ── */
    #left-panel, #right-panel {
      position: fixed;
      top: 0;
      height: 100%;
      z-index: 10;
      background: rgba(20, 20, 30, 0.88);
      backdrop-filter: blur(12px);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      padding: 16px 18px;
      overflow-y: auto;
    }
    #left-panel {
      left: 0;
      width: 30%;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    #right-panel {
      right: 0;
      width: 30%;
      border-left: 1px solid rgba(255,255,255,0.08);
    }
    .panel-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .panel-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.12);
    }

    /* ── 左侧上半：工具框 ── */
    #tools-box {
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    #tools-box .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    #tools-box .row label {
      min-width: 78px;
      text-align: right;
      color: #aaa;
      font-size: 13px;
      flex-shrink: 0;
    }
    #tools-box input[type="file"] {
      flex: 1;
      color: #ccc;
      font-size: 12px;
      min-width: 0;
    }
    #tools-box select {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a38;
      color: #e0e0e0;
      font-size: 13px;
      cursor: pointer;
    }
    #tools-box select:focus { outline: none; border-color: #7c6ff7; }
    #tools-box button {
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
    }
    #btn-analyze { background: #3a3a50; color: #ccc; }
    #btn-analyze:hover { background: #4a4a65; }
    #btn-process {
      background: linear-gradient(135deg, #7c6ff7, #5b4fcf);
      color: #fff;
    }
    #btn-process:hover { background: linear-gradient(135deg, #8f83f8, #6b5fd8); }
    #btn-process:disabled, #btn-analyze:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #upload-status {
      display: block;
      font-size: 12px;
      color: #999;
      min-height: 16px;
      text-align: center;
      margin-top: 4px;
    }
    #upload-status.success { color: #4cff8d; }
    #upload-status.error { color: #ff6b6b; }
    #upload-status.info { color: #7c6ff7; }

    /* ── 左侧下半：穿搭 ── */
    #outfit-box { padding-top: 16px; flex: 1; }
    .outfit-options {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .outfit-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 9px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }
    .outfit-option:hover { background: rgba(255,255,255,0.09); }
    .outfit-option:has(input:checked) {
      background: rgba(124,111,247,0.16);
      border-color: rgba(124,111,247,0.55);
    }
    .outfit-option input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #7c6ff7;
      cursor: pointer;
    }

    /* ── 右侧：衣橱折叠框 ── */
    #wardrobe-list { display: flex; flex-direction: column; gap: 12px; }
    .accordion {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      overflow: hidden;
    }
    .accordion-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 16px;
      background: rgba(255,255,255,0.05);
      color: #e0e0e0;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-align: left;
    }
    .accordion-header:hover { background: rgba(255,255,255,0.1); }
    .accordion-header .chevron {
      transition: transform 0.2s;
      color: #aaa;
      font-size: 12px;
    }
    .accordion.active .chevron { transform: rotate(180deg); }
    .accordion-body { display: none; padding: 13px; }
    .accordion.active .accordion-body { display: block; }

    /* 横向 5 个格子 */
    .slot-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .slot {
      aspect-ratio: 3 / 4;
      border: 1px dashed rgba(255,255,255,0.28);
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.3);
      font-size: 24px;
    }
    .slot::before { content: '+'; }
    /* 已放入衣服的格子 */
    .slot.filled { border-style: solid; cursor: pointer; overflow: hidden; padding: 0; }
    .slot.filled::before { content: none; }
    .slot.filled img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .slot.filled:hover { border-color: #7c6ff7; }
    .slot.filled.selected {
      border-color: #7c6ff7;
      box-shadow: 0 0 0 2px rgba(124,111,247,0.55);
    }

    /* ── 模型标签（中部） ── */
    #model-badge {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(20, 20, 30, 0.85);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 8px;
      color: #ccc;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.08);
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── 纹理切换面板（底部中部） ── */
    #texture-panel {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(20, 20, 30, 0.85);
      backdrop-filter: blur(12px);
      padding: 10px 18px;
      border-radius: 12px;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.08);
    }
    #texture-panel label {
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 6px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    #texture-panel label:hover { background: rgba(255,255,255,0.1); }
    #texture-panel input[type="radio"] { accent-color: #7c6ff7; }

    /* 滚动条 */
    #left-panel::-webkit-scrollbar, #right-panel::-webkit-scrollbar { width: 6px; }
    #left-panel::-webkit-scrollbar-thumb, #right-panel::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- ══════════ 左侧面板 ══════════ -->
  <div id="left-panel">
    <!-- 上半边：工具框 -->
    <div id="tools-box">
      <div class="panel-title">🛠️ 工具</div>
      <div class="row">
        <label>📷 人物照片</label>
        <input type="file" id="file-photo" accept="image/*" />
      </div>
      <div class="row">
        <label>🎯 目标服装</label>
        <select id="select-clothing">
          <option value="upper">👕 上衣 (Upper)</option>
          <option value="upper+vest">🦺 背心 (Vest)</option>
          <option value="skirt">👗 裙子 (Skirt)</option>
          <option value="pants" disabled>👖 裤子 (Pants — 暂无UV模板)</option>
          <option value="dress" disabled>👘 连衣裙 (Dress — 暂无UV模板)</option>
        </select>
      </div>
      <div class="row">
        <button id="btn-analyze">🔍 分析照片</button>
        <button id="btn-process">✨ 生成纹理</button>
      </div>
      <span id="upload-status"></span>
    </div>

    <!-- 下半边：穿搭（多选） -->
    <div id="outfit-box">
      <div class="panel-title">👗 穿搭</div>
      <div class="outfit-options">
        <label class="outfit-option"><input type="checkbox" value="upper" checked /> 👕 上衣</label>
        <label class="outfit-option"><input type="checkbox" value="upper+vest" /> 🦺 背心</label>
        <label class="outfit-option"><input type="checkbox" value="pants" /> 👖 裤子</label>
        <label class="outfit-option"><input type="checkbox" value="skirt" /> 👗 裙子</label>
        <label class="outfit-option"><input type="checkbox" value="dress" /> 👘 连衣裙</label>
      </div>
    </div>
  </div>

  <!-- ══════════ 右侧面板：衣橱 ══════════ -->
  <div id="right-panel">
    <div class="panel-title">🧺 衣橱</div>
    <div id="wardrobe-list">
      <div class="accordion">
        <button class="accordion-header" type="button">👕 上衣 <span class="chevron">▾</span></button>
        <div class="accordion-body">
          <div class="slot-grid">
            <div class="slot filled" data-texture="assets/Texture/T-Shirt.png" data-clothing="upper"><img src="assets/clothing/Blue-T-Shirt_no_sleeves.png" alt="T-Shirt" /></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
          </div>
        </div>
      </div>
      <div class="accordion">
        <button class="accordion-header" type="button">🦺 背心 <span class="chevron">▾</span></button>
        <div class="accordion-body">
          <div class="slot-grid">
            <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
          </div>
        </div>
      </div>
      <div class="accordion">
        <button class="accordion-header" type="button">👖 裤子 <span class="chevron">▾</span></button>
        <div class="accordion-body">
          <div class="slot-grid">
            <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 当前显示的模型 -->
  <div id="model-badge">🧍 人台 + 上衣</div>

  <!-- 纹理切换 -->
  <div id="texture-panel">
    <label><input type="radio" name="texture" value="none" checked /> 🚫 无纹理</label>
    <label><input type="radio" name="texture" value="checker" /> 🏁 棋盘格</label>
    <label><input type="radio" name="texture" value="stripe" /> 📏 条纹</label>
    <label><input type="radio" name="texture" value="generated" /> 🎨 生成纹理</label>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ─── 场景 ──────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcccccc);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.15, 2.5);
    camera.lookAt(0, 1.15, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(0, 2, 2);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(2, 20, 0x888888, 0x444444);
    scene.add(grid);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 1.15, 0);
    controls.update();

    // API 地址: localStorage 手动设置 > 自动检测（手机通过 IP 访问时自动找同 IP 的 API）> localhost
    function resolveAPI() {
      const saved = localStorage.getItem('api_url');
      if (saved) return saved;
      const h = window.location.hostname;
      if (h && h !== 'localhost' && h !== '127.0.0.1') {
        // 手机或局域网访问: API 在同一 IP 的 5000 端口
        return window.location.protocol + '//' + h + ':5000';
      }
      return 'http://localhost:5000';
    }
    const API = resolveAPI();
    console.log('API:', API);
    const CACHE_BUST = '?v=' + Date.now();
    const mtlLoader = new MTLLoader();
    const objLoader = new OBJLoader();

    // ─── 服装模型配置 ──────────────────────────────────
    const CLOTHING_CONFIG = {
      'upper':      { obj: 'assets/models/Woman-T-Shirt.obj', label: '上衣' },
      'upper+vest': { obj: 'assets/models/WomanVest.obj',     label: '背心' },
      'skirt':      { obj: 'assets/models/Skirt.obj',         label: '裙子' },
      'pants':      { obj: 'assets/models/WomanTrouser.obj',  label: '裤子' },
      'dress':      { obj: null,                              label: '连衣裙' },
    };

    const clothingModels = {};    // 已加载的模型缓存: type -> { group, meshes }
    const renderedClothing = {};  // 当前渲染中的模型: type -> { group, meshes }

    function loadClothingModel(type) {
      return new Promise((resolve, reject) => {
        const config = CLOTHING_CONFIG[type];
        if (!config || !config.obj) {
          reject(new Error(`无 3D 模型: ${type}`));
          return;
        }
        if (clothingModels[type]) {
          resolve(clothingModels[type]);
          return;
        }
        console.log(`📦 加载模型: ${config.obj}`);
        objLoader.load(config.obj + CACHE_BUST, (group) => {
          const meshes = [];
          group.traverse((child) => {
            if (child.isMesh) {
              child.material = new THREE.MeshStandardMaterial({
                map: null,
                color: 0xffffff,
                roughness: 0.5,
                metalness: 0.05,
                side: THREE.DoubleSide,
              });
              meshes.push(child);
            }
          });
          clothingModels[type] = { group, meshes };
          console.log(`✅ ${config.label} 模型加载完成 (${meshes.length} mesh)`);
          resolve(clothingModels[type]);
        }, undefined, reject);
      });
    }

    function getCheckedOutfit() {
      return [...document.querySelectorAll('.outfit-option input:checked')].map(cb => cb.value);
    }

    // ─── 穿搭多选 → 同步渲染 ──────────────────────────
    function updateOutfit() {
      const checked = getCheckedOutfit();

      // 移除已取消勾选的模型
      for (const type of Object.keys(renderedClothing)) {
        if (!checked.includes(type)) {
          scene.remove(renderedClothing[type].group);
          delete renderedClothing[type];
        }
      }

      // 加载并添加勾选的模型
      checked.forEach(type => {
        if (renderedClothing[type]) return;
        loadClothingModel(type).then(entry => {
          // 加载期间可能被取消勾选，再次确认
          if (!getCheckedOutfit().includes(type)) return;
          renderedClothing[type] = entry;
          scene.add(entry.group);
          refreshTextures();
          updateBadge();
        }).catch(err => {
          console.warn(`⚠ ${type} 模型加载失败:`, err.message);
        });
      });

      refreshTextures();
      updateBadge();
    }

    function updateBadge() {
      const checked = getCheckedOutfit();
      const labels = checked.map(v => CLOTHING_CONFIG[v]?.label || v);
      const text = checked.length ? `🧍 人台 + ${labels.join(' + ')}` : '🧍 人台';
      document.getElementById('model-badge').textContent = text;
    }

    // ─── 纹理管理 ──────────────────────────────────────
    let currentTextureMode = 'none';   // none | checker | stripe | generated
    let checkerTexture = null;
    let stripeTexture = null;
    let generatedTexture = null;
    let generatedTextureType = null;
    const wardrobeTextures = {};   // type -> THREE.Texture（来自衣橱格子点击）

    function applyTextureToEntry(entry, texture) {
      entry.meshes.forEach(mesh => {
        mesh.material.map = texture;
        mesh.material.color.set(0xffffff);
        mesh.material.needsUpdate = true;
      });
    }

    function refreshTextures() {
      for (const [type, entry] of Object.entries(renderedClothing)) {
        let tex = null;
        if (wardrobeTextures[type]) {
          // 衣橱格子选中的纹理优先
          tex = wardrobeTextures[type];
        } else if (currentTextureMode === 'checker') {
          tex = checkerTexture || (checkerTexture = createCheckerTexture());
        } else if (currentTextureMode === 'stripe') {
          tex = stripeTexture || (stripeTexture = createStripeTexture());
        } else if (currentTextureMode === 'generated') {
          // 生成纹理只应用到对应的服装类型
          tex = (type === generatedTextureType) ? generatedTexture : null;
        }
        applyTextureToEntry(entry, tex);
      }
    }

    // ─── 预设纹理 ──────────────────────────────────────
    function createCheckerTexture(size = 512, squares = 8) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const sq = size / squares;
      for (let y = 0; y < squares; y++) {
        for (let x = 0; x < squares; x++) {
          ctx.fillStyle = (x + y) % 2 === 0 ? '#333333' : '#eeeeee';
          ctx.fillRect(x * sq, y * sq, sq, sq);
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createStripeTexture(size = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      const sw = size / 20;
      ctx.fillStyle = '#3366cc';
      for (let i = 0; i < size; i += sw * 2) ctx.fillRect(i, 0, sw, size);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // ─── 纹理切换 ──────────────────────────────────────
    document.querySelectorAll('input[name="texture"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        currentTextureMode = e.target.value;
        refreshTextures();
      });
    });

    // ─── 衣橱折叠框展开/收起 ──────────────────────────
    document.querySelectorAll('.accordion-header').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.parentElement.classList.toggle('active');
      });
    });

    // ─── 衣橱格子：点击应用 UV 纹理 ────────────────────
    const wardrobeTexLoader = new THREE.TextureLoader();
    function applyWardrobeTexture(type, url) {
      // 确保对应穿搭已勾选并渲染
      const cb = document.querySelector(`.outfit-option input[value="${type}"]`);
      if (cb && !cb.checked) {
        cb.checked = true;
        updateOutfit();
      }
      wardrobeTexLoader.load(url, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        wardrobeTextures[type] = tex;
        refreshTextures();
      }, undefined, (err) => console.warn('⚠ 衣橱纹理加载失败:', err));
    }

    document.querySelectorAll('.slot[data-texture]').forEach(slot => {
      slot.addEventListener('click', () => {
        const type = slot.dataset.clothing;
        const url = slot.dataset.texture;
        // 高亮选中格子
        document.querySelectorAll('.slot.filled').forEach(s => s.classList.remove('selected'));
        slot.classList.add('selected');
        applyWardrobeTexture(type, url);
      });
    });

    // ─── 穿搭多选事件 ──────────────────────────────────
    document.querySelectorAll('.outfit-option input').forEach(cb => {
      cb.addEventListener('change', updateOutfit);
    });

    // ─── 分析照片 → 仅推荐纹理生成目标（不更改渲染） ────
    const btnAnalyze = document.getElementById('btn-analyze');
    const btnProcess = document.getElementById('btn-process');
    const uploadStatus = document.getElementById('upload-status');
    const selectClothing = document.getElementById('select-clothing');

    btnAnalyze.addEventListener('click', async () => {
      const photoFile = document.getElementById('file-photo').files[0];
      if (!photoFile) {
        uploadStatus.textContent = '请先选择人物照片';
        uploadStatus.className = 'error';
        return;
      }
      btnAnalyze.disabled = true;
      btnProcess.disabled = true;
      uploadStatus.textContent = '🔍 SegFormer 分析中…';
      uploadStatus.className = 'info';

      try {
        const fd = new FormData();
        fd.append('photo', photoFile);
        const res = await fetch(`${API}/api/analyze`, { method: 'POST', body: fd });
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        const top3 = data.classes.slice(0, 5).map(c => `${c.name}(${c.ratio}%)`).join(', ');
        uploadStatus.textContent = `📊 检测: ${top3}`;
        uploadStatus.className = 'success';

        // 自动推荐：仅设置纹理生成目标，不更改渲染页面
        if (data.suggestion) {
          selectClothing.value = data.suggestion;
          uploadStatus.textContent += ` → 推荐: ${data.suggestion}`;
        }
      } catch (err) {
        uploadStatus.textContent = '❌ ' + err.message;
        uploadStatus.className = 'error';
      } finally {
        btnAnalyze.disabled = false;
        btnProcess.disabled = false;
      }
    });

    // ─── 生成纹理（不更改渲染） ────────────────────────
    btnProcess.addEventListener('click', async () => {
      const photoFile = document.getElementById('file-photo').files[0];
      if (!photoFile) {
        uploadStatus.textContent = '请先选择人物照片';
        uploadStatus.className = 'error';
        return;
      }

      const clothingType = selectClothing.value;
      btnAnalyze.disabled = true;
      btnProcess.disabled = true;
      uploadStatus.textContent = `⏳ AI 管线处理中（${clothingType}）…`;
      uploadStatus.className = 'info';

      try {
        const fd = new FormData();
        fd.append('photo', photoFile);
        fd.append('clothing_type', clothingType);

        const res = await fetch(`${API}/process`, { method: 'POST', body: fd });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || '处理失败');
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          canvas.getContext('2d').drawImage(img, 0, 0);
          generatedTexture = new THREE.CanvasTexture(canvas);
          generatedTexture.colorSpace = THREE.SRGBColorSpace;
          generatedTextureType = clothingType;

          // 切换到"生成纹理"并应用到对应服装
          currentTextureMode = 'generated';
          document.querySelector('input[value="generated"]').checked = true;
          refreshTextures();

          uploadStatus.textContent = `✅ 完成！纹理 ${img.width}×${img.height} 已应用`;
          uploadStatus.className = 'success';
          btnAnalyze.disabled = false;
          btnProcess.disabled = false;
        };
        img.src = url;
      } catch (err) {
        uploadStatus.textContent = '❌ ' + err.message;
        uploadStatus.className = 'error';
        btnAnalyze.disabled = false;
        btnProcess.disabled = false;
      }
    });

    // ─── 初始化：加载人台 + 默认穿搭 ────────────────────
    console.log('🎯 Virtual Try-On 初始化...');
    // 人台（使用模型自带的 MTL 材质，白色，而非硬编码的粉色）
    mtlLoader.load('assets/models/womannequin.mtl', (materials) => {
      materials.preload();
      objLoader.setMaterials(materials);
      objLoader.load('assets/models/womannequin.obj' + CACHE_BUST, (mannequin) => {
        mannequin.traverse((child) => {
          if (child.isMesh) {
            child.material.side = THREE.DoubleSide;
          }
        });
        scene.add(mannequin);
        console.log('✅ 人台加载完成（自带白色材质）');
      }, undefined, (err) => console.warn('⚠ 人台 OBJ 加载失败:', err));
    }, undefined, (err) => {
      console.warn('⚠ 人台 MTL 加载失败，回退为纯白材质:', err);
      objLoader.load('assets/models/womannequin.obj' + CACHE_BUST, (mannequin) => {
        mannequin.traverse((child) => {
          if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({
              color: 0xffffff, roughness: 0.6, metalness: 0.1,
              side: THREE.DoubleSide,
            });
          }
        });
        scene.add(mannequin);
      });
    });
    // 默认穿搭：上衣已勾选
    updateOutfit();

    // ─── 渲染循环 ──────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    console.log('🎯 就绪 — 左侧选择穿搭，右侧浏览衣橱');
  </script>
</body>
</html>
